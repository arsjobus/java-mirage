name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test runnable JAR
        run: mvn --batch-mode clean package

      - name: Rename platform JAR
        shell: bash
        run: mv target/pixelforge-0.1.0-SNAPSHOT.jar target/pixelforge-${{ matrix.platform }}.jar

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: pixelforge-${{ matrix.platform }}
          path: target/pixelforge-${{ matrix.platform }}.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download platform JARs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.jar --generate-notes --repo "$GITHUB_REPOSITORY"
